<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Monitor de Preço de Mercado{% endblock %}</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background: #f4f5f7; color: #1f2430;
        }
        header.topo {
            background: #14213d; color: #fff; padding: 14px 24px;
            display: flex; align-items: center; gap: 24px;
        }
        header.topo h1 { font-size: 18px; margin: 0; font-weight: 600; }
        header.topo nav a {
            color: #cfd8ea; text-decoration: none; font-size: 14px; margin-right: 16px;
        }
        header.topo nav a.ativo, header.topo nav a:hover { color: #fff; font-weight: 600; }
        main { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .cartoes { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .cartao {
            background: #fff; border-radius: 10px; padding: 16px 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 160px;
        }
        .cartao .valor { font-size: 26px; font-weight: 700; }
        .cartao .rotulo { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .04em; }
        .cartao.alerta .valor { color: #c0392b; }
        form.filtros {
            display: flex; gap: 12px; align-items: end; margin-bottom: 16px;
            background: #fff; padding: 14px 18px; border-radius: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); flex-wrap: wrap;
        }
        form.filtros label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
        form.filtros select, form.filtros button {
            padding: 7px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
        }
        form.filtros button { background: #14213d; color: #fff; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
        table { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13.5px; }
        th { background: #eef1f6; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: #444; }
        tr:hover { background: #fafbfd; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .tag.caro { background: #fdecea; color: #c0392b; }
        .tag.barato { background: #eafaf1; color: #1e8449; }
        .tag.neutro { background: #eee; color: #666; }
        .vazio { padding: 40px; text-align: center; color: #888; }
    </style>
</head>
<body>
<header class="topo">
    <h1>🔎 Monitor de Preço de Mercado</h1>
    <nav>
        <a href="{% url 'monitor:monitor_preco' %}" {% if request.resolver_match.url_name == 'monitor_preco' %}class="ativo"{% endif %}>Monitor de Preço</a>
        <a href="{% url 'vendas:relevancia' %}" {% if request.resolver_match.url_name == 'relevancia' %}class="ativo"{% endif %}>Relevância</a>
        <a href="{% url 'vendas:custo_margem' %}" {% if request.resolver_match.url_name == 'custo_margem' %}class="ativo"{% endif %}>Custo x Margem</a>
        <a href="#" title="Ainda não implementado">Análise de Entradas</a>
    </nav>
</header>
<main>
    {% block conteudo %}{% endblock %}
</main>
</body>
</html>
