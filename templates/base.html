<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Monitor de Preço de Mercado{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10141b; --superficie: #1a1f29; --superficie2: #212836;
            --borda: #2a3140; --texto: #e6e9ef; --texto-fraco: #8b93a3;
            --acento: #5b8dee; --acento-bg: #1e2a44; --acento-texto: #0b0f14;
            --vermelho: #ff6b6b; --vermelho-bg: rgba(255,107,107,.14);
            --verde: #4ade80; --verde-bg: rgba(74,222,128,.14);
            --sidebar-w: 230px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif;
            background: var(--bg); color: var(--texto);
        }
        .layout { display: flex; min-height: 100vh; }
        aside {
            width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
            background: var(--superficie); border-right: 1px solid var(--borda);
            padding: 18px 14px; position: sticky; top: 0; height: 100vh;
            overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
        }
        aside h1 { font-size: 15.5px; margin: 0; padding: 0 6px; font-weight: 600; }
        aside h1 span { display: block; color: var(--texto-fraco); font-weight: 400; font-size: 12px; margin-top: 2px; }
        aside nav { display: flex; flex-direction: column; gap: 2px; }
        aside nav .grupo-titulo {
            font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
            color: var(--texto-fraco); margin: 14px 6px 2px; font-weight: 600;
        }
        aside nav .grupo-titulo:first-child { margin-top: 0; }
        aside nav a {
            color: var(--texto); text-decoration: none; padding: 7px 10px;
            border-radius: 7px; font-size: 13.8px;
        }
        aside nav a:hover { background: var(--acento-bg); }
        aside nav a.ativo { background: var(--acento); color: var(--acento-texto); font-weight: 600; }
        .conteudo { flex: 1; min-width: 0; }
        main { padding: 24px; max-width: 1400px; margin: 0 auto; }
        h2 { color: var(--texto); font-size: 16px; }
        .cartoes { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .cartao {
            background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px;
            padding: 16px 20px; min-width: 160px;
        }
        .cartao .valor { font-size: 26px; font-weight: 700; color: var(--texto); }
        .cartao .rotulo { font-size: 12px; color: var(--texto-fraco); text-transform: uppercase; letter-spacing: .04em; }
        .cartao.alerta .valor { color: var(--vermelho); }
        form.filtros {
            display: flex; gap: 12px; align-items: end; margin-bottom: 16px;
            background: var(--superficie); border: 1px solid var(--borda);
            padding: 14px 18px; border-radius: 10px; flex-wrap: wrap;
        }
        form.filtros label { display: block; font-size: 12px; color: var(--texto-fraco); margin-bottom: 4px; }
        form.filtros select, form.filtros button {
            padding: 7px 10px; border-radius: 6px; border: 1px solid var(--borda); font-size: 14px;
            background: var(--superficie2); color: var(--texto);
        }
        form.filtros button { background: var(--acento); color: var(--acento-texto); border: none; cursor: pointer; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; background: var(--superficie); border-radius: 10px; overflow: hidden; }
        table { border: 1px solid var(--borda); }
        th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--borda); font-size: 13.5px; }
        th { background: var(--superficie2); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--texto-fraco); }
        tr:hover { background: var(--superficie2); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .tag.caro { background: var(--vermelho-bg); color: var(--vermelho); }
        .tag.barato { background: var(--verde-bg); color: var(--verde); }
        .tag.neutro { background: var(--superficie2); color: var(--texto-fraco); }
        .vazio { padding: 40px; text-align: center; color: var(--texto-fraco); }
        .dist { color: var(--texto-fraco); font-size: 12px; }
        .painel-detalhe {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            padding: 16px 4px;
        }
        .painel-detalhe h3 {
            margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
            letter-spacing: .03em; color: var(--texto-fraco); font-weight: 600;
        }
        .painel-detalhe table { background: var(--superficie2); }
        .painel-detalhe th { background: var(--bg); }
        .painel-curva { padding: 0 4px 12px; border-top: 1px solid var(--borda); margin-top: 4px; padding-top: 12px; }
        .painel-curva h3 {
            margin: 0 0 4px; font-size: 12px; text-transform: uppercase;
            letter-spacing: .03em; color: var(--texto-fraco); font-weight: 600;
        }
        .painel-curva svg { display: block; max-width: 420px; }
        th.th-ordenavel { cursor: pointer; user-select: none; }
        th.th-ordenavel::after { content: ''; display: inline-block; width: 10px; }
        th.ordenado-asc::after { content: '▲'; font-size: 9px; margin-left: 4px; }
        th.ordenado-desc::after { content: '▼'; font-size: 9px; margin-left: 4px; }
        .campo-busca {
            padding: 7px 10px; border-radius: 6px; border: 1px solid var(--borda);
            background: var(--superficie2); color: var(--texto); font-size: 14px;
            width: 260px; margin-bottom: 12px;
        }
        .barra-sincronizacao {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 16px;
        }
        .botao-icone {
            width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--borda);
            background: var(--superficie2); color: var(--texto-fraco); font-size: 15px;
            line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .botao-icone:hover { background: var(--superficie); color: var(--texto); }
        .avisos { position: fixed; top: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
        .aviso {
            padding: 10px 14px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 2px 10px rgba(0,0,0,.3);
            background: var(--verde-bg); color: var(--verde); border: 1px solid var(--verde);
        }
        .aviso.aviso-erro { background: var(--vermelho-bg); color: var(--vermelho); border-color: var(--vermelho); }
        .aviso-some { animation: aviso-desaparecer .4s ease-in 4s forwards; }
        @keyframes aviso-desaparecer { to { opacity: 0; transform: translateX(20px); visibility: hidden; } }
        .cartao-link { text-decoration: none; display: block; }
        .cartao-link .cartao { cursor: pointer; transition: border-color .15s; }
        .cartao-link:hover .cartao { border-color: var(--acento); }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <h1>🔎 Monitor de Preço <span>Grupo Velanes</span></h1>
        <nav>
            <div class="grupo-titulo">Preço</div>
            <a href="{% url 'monitor:monitor_preco' %}" {% if request.resolver_match.url_name == 'monitor_preco' %}class="ativo"{% endif %}>Monitor de Preço</a>
            <a href="#" title="Ainda não implementado">Análise de Entradas</a>

            <div class="grupo-titulo">Vendas</div>
            <a href="{% url 'vendas:relevancia' %}" {% if request.resolver_match.url_name == 'relevancia' %}class="ativo"{% endif %}>Relevância</a>
            <a href="{% url 'vendas:custo_margem' %}" {% if request.resolver_match.url_name == 'custo_margem' %}class="ativo"{% endif %}>Custo x Margem</a>

            <div class="grupo-titulo">Sistema</div>
            <a href="/admin/">Admin</a>
        </nav>
    </aside>
    <div class="conteudo">
        <main>
            {% block conteudo %}{% endblock %}
        </main>
    </div>
</div>
<script src="{% static 'js/tabela.js' %}"></script>
</body>
</html>
